services:
  web:
    image: ghcr.io/eduardodxcosta/siteedxc:${IMAGE_TAG:-latest}
    networks:
      - public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
      resources:
        limits:
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=EDXCNET"
        # router HTTPS (porta 443) — serve o site
        - "traefik.http.routers.siteedxc.rule=Host(`edxcautomacao.com.br`)"
        - "traefik.http.routers.siteedxc.entrypoints=websecure"
        - "traefik.http.routers.siteedxc.tls=true"
        - "traefik.http.routers.siteedxc.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.siteedxc.loadbalancer.server.port=80"
        # router HTTP (porta 80) — redireciona pra HTTPS
        - "traefik.http.routers.siteedxc-http.rule=Host(`edxcautomacao.com.br`)"
        - "traefik.http.routers.siteedxc-http.entrypoints=web"
        - "traefik.http.routers.siteedxc-http.middlewares=siteedxc-https-redirect"
        # middleware que faz o redirect 301 HTTP -> HTTPS
        - "traefik.http.middlewares.siteedxc-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.siteedxc-https-redirect.redirectscheme.permanent=true"

networks:
  public:
    external: true
    name: EDXCNET
